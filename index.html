<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LevelUp Class</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0b0f1a; font-family: 'Nunito', 'Segoe UI', sans-serif; }
    #root { min-height: 100vh; }
    #loading {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh;
      background: #0b0f1a; color: #a5b4fc;
      font-family: 'Nunito', sans-serif; gap: 1rem;
    }
    #loading .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(99,102,241,0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet"/>

  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel standalone (transpila JSX en el navegador) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

  <!-- Loading screen while Babel transpiles -->
  <div id="loading">
    <div class="spinner"></div>
    <div style="font-size:1.1rem;font-weight:700;">Cargando LevelUp Class…</div>
    <div style="font-size:0.8rem;color:#6b7280;">Puede tardar unos segundos la primera vez</div>
  </div>

  <div id="root" style="display:none"></div>

  <script type="text/babel" data-presets="react" src="levelup-class-v21.jsx"
    onload="
      document.getElementById('loading').style.display='none';
      document.getElementById('root').style.display='block';
    ">
  </script>

  <script>
    // Mount React app once Babel finishes
    window.addEventListener('LevelUpReady', () => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('root').style.display    = 'block';
    });

    // Fallback: if script attr onload doesn't fire, Babel fires DOMContentLoaded late
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        if (window.__LEVELUP_MOUNTED__) return;
        try {
          const container = document.getElementById('root');
          const root = ReactDOM.createRoot(container);
          root.render(React.createElement(App));
          window.__LEVELUP_MOUNTED__ = true;
          document.getElementById('loading').style.display = 'none';
          container.style.display = 'block';
        } catch(e) {
          // App not ready yet — Babel is still transpiling, it will auto-mount
        }
      }, 500);
    });
  </script>

  <!-- Auto-mount after Babel transpiles the JSX -->
  <script type="text/babel" data-presets="react">
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
    document.getElementById('loading').style.display = 'none';
    container.style.display = 'block';
    window.__LEVELUP_MOUNTED__ = true;
  </script>

</body>
</html>
